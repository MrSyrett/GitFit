<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Daily fitness coach: schedule-aware hub, coached strength, walk-to-run cardio and stretch mobility, plus weekly and all-time progress — saved on your device.">
<meta name="theme-color" content="#d6492f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GitFit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icon-512.png" sizes="512x512" type="image/png">
<style>
  html{color-scheme:light}
  :root{padding:0 0 env(safe-area-inset-bottom,0px)}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>GitFit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: mobile-first; Today hub + per-activity tabs; coached full-screen session player overlays for cardio & mobility; fixed rest-timer bar during strength work. */
:root{
  --bg:#f1efe9; --surface:#ffffff; --surface-2:#eceae2; --raise:#f8f6f1;
  --fg:#1b1917; --muted:#6c675d; --faint:#938d81; --line:#dbd6cc;
  --accent:#d6492f; --accent-press:#b73c25; --on-accent:#fff6ef;
  --good:#1c8a56; --warn:#b5810d; --bad:#cf4634;
  --walk:#2a78d6; --run:#d6492f; --warm:#b5810d; --cool:#1baf7a;
  --chart-surface:#fcfcfb; --chart-ink:#0b0b0b; --chart-ink-2:#52514e; --chart-grid:#e7e3da;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --radius:12px; --shadow:0 1px 2px rgba(20,16,12,.06),0 2px 10px rgba(20,16,12,.05);
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131110; --surface:#1d1a17; --surface-2:#262220; --raise:#232019;
  --fg:#f4f1ea; --muted:#a39c8f; --faint:#7b746a; --line:#332e28;
  --accent:#e4572e; --accent-press:#f06a42; --on-accent:#17120e;
  --good:#39b57e; --warn:#e0a400; --bad:#e46a58;
  --walk:#3987e5; --run:#e4572e; --warm:#e0a400; --cool:#199e70;
  --chart-surface:#1a1a19; --chart-ink:#ffffff; --chart-ink-2:#c3c2b7; --chart-grid:#312d27;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131110; --surface:#1d1a17; --surface-2:#262220; --raise:#232019;
  --fg:#f4f1ea; --muted:#a39c8f; --faint:#7b746a; --line:#332e28;
  --accent:#e4572e; --accent-press:#f06a42; --on-accent:#17120e;
  --good:#39b57e; --warn:#e0a400; --bad:#e46a58;
  --walk:#3987e5; --run:#e4572e; --warm:#e0a400; --cool:#199e70;
  --chart-surface:#1a1a19; --chart-ink:#ffffff; --chart-ink-2:#c3c2b7; --chart-grid:#312d27;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body.has-timer .screen{padding-bottom:84px}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.2px}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px}
.num{font-variant-numeric:tabular-nums}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px 8px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto}
.mark{width:22px;height:22px;flex:none}
.brand b{font-family:var(--f-disp);font-weight:700;font-size:20px;letter-spacing:.5px;text-transform:uppercase}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:34px;height:30px;font-size:15px;line-height:1;display:grid;place-items:center;flex:none}
.iconbtn[aria-current="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.nav{display:flex;gap:2px;padding:0 10px 9px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:1 1 0;min-width:70px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;letter-spacing:.3px;text-transform:uppercase;padding:8px 6px;border-radius:9px;white-space:nowrap}
.nav button[aria-current="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

.screen{max-width:560px;margin:0 auto;padding:16px 16px 40px;padding-block:16px 40px}
.eyebrow{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);font-weight:600}
.h-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.h-top h1{font-size:30px;line-height:1}
.h-top .date{color:var(--muted);font-size:13px;text-align:right}
.phase-pill{display:inline-block;margin-top:5px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);border:1px solid var(--line);border-radius:100px;padding:2px 9px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:12px}

/* ---- Today hub ---- */
.summary{display:flex;align-items:center;gap:14px;padding:15px}
.ring{--p:0;width:58px;height:58px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--surface-2) 0)}
.ring .in{width:46px;height:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:17px}
.summary .sx b{font-family:var(--f-disp);font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.summary .sx div{color:var(--muted);font-size:12.5px}
.hubcard{display:flex;align-items:center;gap:13px;padding:13px 14px;text-align:left;width:100%;border:0;background:transparent}
.hubcard .hi{width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:19px;flex:none}
.hubcard .hb{flex:1;min-width:0}
.hubcard .hb b{font-family:var(--f-disp);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;display:block;line-height:1.1}
.hubcard .hb span{color:var(--muted);font-size:12.5px}
.hubcard .hx{flex:none;display:flex;align-items:center;gap:9px}
.pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:3px 9px;border-radius:100px;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--good);color:#fff}
.chev{color:var(--faint);font-size:20px;line-height:1}
.hubcard+.hubcard{border-top:1px solid var(--line)}
.inlinelog{display:flex;gap:9px;padding:0 14px 13px}
.inlinelog input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--fg);font-family:var(--f-disp);font-weight:600;font-size:18px;text-align:center}
.inlinelog button{flex:none;border:0;border-radius:10px;padding:0 16px;background:var(--accent);color:var(--on-accent);font-family:var(--f-disp);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.3px}
.habtog{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;border:0;background:transparent;text-align:left}
.habtog+.habtog{border-top:1px solid var(--line)}
.habtog .box{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:transparent;font-weight:700}
.habtog[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.habtog .ht{flex:1;font-weight:500}
.habtog .ht small{display:block;color:var(--muted);font-weight:400;font-size:12px}

/* ---- shared workout pieces ---- */
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.ex-head .n{display:flex;align-items:baseline;gap:9px;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none;transform:translateY(1px)}
.ex-head h2{font-size:21px;text-transform:uppercase;letter-spacing:.4px}
.ex-head .scheme{font-family:var(--f-disp);font-size:19px;color:var(--muted);font-weight:500;white-space:nowrap}
.ex-head .scheme b{color:var(--fg);font-weight:600}
.setlist{padding:4px 7px 9px}
.seth{display:flex;align-items:center;gap:10px;padding:9px 8px 5px;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.row{display:flex;align-items:center;gap:11px;padding:7px 8px;border-radius:10px}
.row+.row{margin-top:1px}
.row.warm{color:var(--muted)}
.chk{width:30px;height:30px;flex:none;border-radius:8px;border:2px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:transparent;font-size:16px;font-weight:700;transition:.12s}
.row.done .chk{background:var(--good);border-color:var(--good);color:#fff}
.row.done .lbl{text-decoration:line-through;text-decoration-color:var(--faint);opacity:.6}
.row .lbl{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.row .lbl .set{font-weight:600;font-size:14px}
.row .lbl .reps{color:var(--muted);font-size:13px}
.row .wt{font-family:var(--f-disp);font-size:23px;font-weight:600;letter-spacing:.3px}
.row .wt small{font-size:12px;font-family:var(--f-body);color:var(--muted);font-weight:500;margin-left:2px}
.row .wt.bw{font-size:16px;color:var(--muted);font-weight:500;font-family:var(--f-body)}
.restbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:6px 9px;flex:none}
.plateview{padding:12px 15px;background:var(--raise);border-top:1px solid var(--line)}
.plate-wrap{display:flex;align-items:center;gap:1px;min-height:62px;overflow-x:auto;padding-bottom:2px}
.collar{width:11px;height:16px;border-radius:2px;background:linear-gradient(var(--faint),var(--muted));flex:none;margin:0 2px}
.barstub{height:7px;width:26px;background:linear-gradient(var(--muted),var(--faint));border-radius:3px;flex:none}
.plate{flex:none;width:17px;border-radius:3px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-disp);font-weight:700;font-size:12px;writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);border:1px solid rgba(0,0,0,.15)}
.plate.lite{color:#1b1917;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.plate-none{color:var(--muted);font-size:13px;padding:8px 2px}
.plate-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:9px;font-size:12px;color:var(--muted)}
.plate-legend .perside{color:var(--fg);font-weight:600}
.remainder{color:var(--bad);font-weight:600}

.btn{display:block;width:100%;border:0;border-radius:11px;padding:14px;font-family:var(--f-disp);font-weight:600;font-size:19px;letter-spacing:.5px;text-transform:uppercase;background:var(--accent);color:var(--on-accent)}
.btn:active{background:var(--accent-press)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn.sm{font-size:14px;padding:10px}
.spacer{height:16px}

.rev-row{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line)}
.rev-row:last-of-type{border-bottom:0}
.rev-row .rn{flex:1;min-width:0}
.rev-row .rn b{font-family:var(--f-disp);font-size:19px;font-weight:600;text-transform:uppercase;display:block}
.rev-row .rn span{color:var(--muted);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;padding:8px 11px}
.seg button[aria-pressed="true"].hit{background:var(--good);color:#fff}
.seg button[aria-pressed="true"].miss{background:var(--bad);color:#fff}

.calc-big{padding:16px 16px 4px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:100px;padding:7px 13px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

.chartcard{padding:14px 12px 10px;background:var(--chart-surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.chartcard+.chartcard{margin-top:12px}
.chartcard h3{color:var(--chart-ink);font-size:18px;padding:0 4px 2px;text-transform:uppercase;letter-spacing:.4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:4px 4px 8px}
.legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--chart-ink-2);font-weight:500}
.legend i{width:11px;height:3px;border-radius:2px;display:block}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.read{min-height:20px;padding:6px 6px 2px;color:var(--chart-ink-2);font-size:12px;text-align:center}
.read b{color:var(--chart-ink)}
.sess{display:flex;align-items:center;gap:10px;padding:11px 14px}
.sess+.sess{border-top:1px solid var(--line)}
.sess .badge{width:30px;height:30px;flex:none;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:16px}
.sess .sd{flex:1;min-width:0}
.sess .sd .dt{font-size:12px;color:var(--muted)}
.sess .sd .lf{font-size:13.5px;display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:1px}
.sess .sd .lf i{font-style:normal;white-space:nowrap}
.sess .sd .lf .x{color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:30px 20px;font-size:14px}

.bw-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px}
.bw-head .big{font-family:var(--f-disp);font-weight:700;font-size:40px;line-height:.9}
.bw-head .big small{font-size:16px;color:var(--muted);font-weight:500}
.bw-head .hi{width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:19px;flex:none}
.backlink{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:100px;padding:6px 14px 6px 11px;font-weight:600;font-size:13px;color:var(--muted);margin-bottom:12px;box-shadow:var(--shadow)}
.rangeseg{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:14px}
.rangeseg button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:8px;border-radius:7px}
.rangeseg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 14px;min-width:0}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);font-weight:600}
.tile .v{font-family:var(--f-disp);font-weight:700;font-size:27px;line-height:1.05;margin-top:3px}
.tile .v small{font-size:13px;color:var(--muted);font-weight:500}
.tile .sub2{font-size:11.5px;color:var(--muted);margin-top:3px}
.weekbars{display:flex;gap:6px;align-items:flex-end;height:96px;padding:12px 15px 6px}
.weekbars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.weekbars .b i{display:block;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.weekbars .b.hit i{background:var(--good)}
.weekbars .b span{text-align:center;font-size:10px;color:var(--faint);margin-top:5px;font-weight:600}
.schedrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.schedrow:last-child{border-bottom:0}
.schedrow .dn{width:42px;font-weight:600;font-size:13px;color:var(--muted)}
.schedrow .segsm{flex:1}
.schedrow .segsm button{flex:1;padding:7px 4px;font-size:12px}
.prog{height:9px;border-radius:100px;background:var(--surface-2);overflow:hidden;margin:2px 15px 14px}
.prog i{display:block;height:100%;border-radius:100px;background:var(--accent);transition:width .25s}
.prog i.hit{background:var(--good)}
.dots{display:flex;gap:6px;padding:4px 15px 14px}
.dots b{flex:1;height:30px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--faint);letter-spacing:.3px}
.dots b.on{background:var(--good);color:#fff}
.dots b.today{box-shadow:inset 0 0 0 2px var(--accent)}
.streakwrap{display:flex;align-items:center;gap:13px;padding:15px}
.streakwrap .flame{font-size:33px;line-height:1}
.streakwrap .flame.off{filter:grayscale(1);opacity:.4}
.streakwrap .n{font-family:var(--f-disp);font-weight:700;font-size:38px;line-height:.85}
.streakwrap .n small{font-size:15px;color:var(--muted);font-weight:500}
.streakwrap .lbl{color:var(--muted);font-size:12.5px;margin-top:1px}
.logrow{display:flex;align-items:center;gap:11px;padding:10px 15px;border-top:1px solid var(--line)}
.logrow .ic{width:30px;height:30px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;flex:none;font-size:15px}
.logrow .ld{flex:1;min-width:0}
.logrow .ld b{font-weight:600}
.logrow .ld .dt{color:var(--muted);font-size:12px}
.logrow .mins{font-family:var(--f-disp);font-weight:600;font-size:17px;white-space:nowrap}
.del{border:0;background:transparent;color:var(--faint);font-size:17px;padding:4px 6px;flex:none}

/* ---- coached session cards (cardio/mobility landing) ---- */
.lvl-head{padding:15px 15px 4px}
.lvl-head .big{font-family:var(--f-disp);font-weight:700;font-size:26px;line-height:1}
.lvl-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
.seglist{padding:4px 15px 8px}
.segline{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px}
.segline .tag{font-family:var(--f-disp);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#fff;padding:2px 8px;border-radius:100px;min-width:62px;text-align:center}
.segline .sg{flex:1;color:var(--muted)}
.segline .sd{font-family:var(--f-disp);font-weight:600;color:var(--fg)}
.lvlnav{display:flex;gap:9px;padding:0 15px 15px}
.lvlnav button{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px;font-weight:600;font-size:13px}
.lvlnav button:disabled{opacity:.4}

/* ---- settings ---- */
.set-group{padding:6px 15px 14px}
.field{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{flex:1;min-width:0;font-weight:500}
.field label small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.field input[type=number]{width:92px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--fg);text-align:right;font-family:var(--f-disp);font-weight:600;font-size:18px}
.segsm{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.segsm button{border:0;background:var(--surface-2);color:var(--muted);padding:8px 14px;font-weight:600;font-size:14px}
.segsm button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.switch{width:50px;height:30px;border-radius:100px;border:1px solid var(--line);background:var(--surface-2);position:relative;flex:none;transition:.15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--faint);transition:.15s}
.switch[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-pressed="true"]::after{left:22px;background:#fff}
.sect-title{font-family:var(--f-disp);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);padding:16px 2px 7px}
.phase-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:12px 14px;margin-bottom:9px}
.phase-opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.phase-opt b{font-family:var(--f-disp);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.phase-opt .tick{margin-left:auto;color:var(--accent);font-weight:700;opacity:0}
.phase-opt[aria-pressed="true"] .tick{opacity:1}
.phase-opt span{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.barchips{display:flex;flex-wrap:wrap;gap:7px}
.barchips button{border:1px solid var(--line);background:var(--surface-2);border-radius:100px;padding:6px 12px;font-family:var(--f-disp);font-weight:600;font-size:15px}
.barchips button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
textarea{width:100%;min-height:80px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--fg);font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}
.note{color:var(--muted);font-size:12.5px;padding:4px 2px 0}
.danger{color:var(--bad)}
.row-btns{display:flex;gap:9px}
.row-btns .btn{flex:1}

/* ---- rest timer bar ---- */
#timerbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.12);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
#timerbar .tinner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
#timerbar .tt{font-family:var(--f-disp);font-weight:700;font-size:38px;line-height:1;letter-spacing:1px;width:112px;color:var(--accent)}
#timerbar .tt.done{color:var(--good)}
#timerbar .presets{display:flex;gap:6px;flex-wrap:wrap;flex:1}
#timerbar .presets button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px;font-weight:600;font-size:13px}
#timerbar .tx{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;width:38px;height:38px;font-size:17px;flex:none;display:grid;place-items:center}

/* ---- coached session player (full screen) ---- */
#player{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.pl-top{display:flex;align-items:center;gap:12px;padding:14px 16px}
.pl-top .ttl{flex:1;font-family:var(--f-disp);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.4px}
.pl-top .cnt{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pl-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:10px 20px}
.pl-phase{font-family:var(--f-disp);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:1px;color:#fff;padding:5px 18px;border-radius:100px}
.pl-time{font-family:var(--f-disp);font-weight:700;font-size:82px;line-height:.85;font-variant-numeric:tabular-nums}
.pl-cue{color:var(--muted);font-size:15px;max-width:30ch;min-height:2.6em}
.pl-next{color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.pl-bar{height:8px;margin:0 16px 4px;background:var(--surface-2);border-radius:100px;overflow:hidden}
.pl-bar i{display:block;height:100%;background:var(--accent);transition:width .3s linear}
.pl-controls{display:flex;gap:16px;align-items:center;justify-content:center;padding:14px 16px 22px}
.pl-controls button{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:56px;height:56px;font-size:21px;display:grid;place-items:center}
.pl-controls .main{width:74px;height:74px;font-size:28px;background:var(--accent);color:var(--on-accent);border:0}
.pl-done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.pl-done .big{font-family:var(--f-disp);font-weight:700;font-size:40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
  header{top:0;background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
  header .bar{padding-top:calc(10px + env(safe-area-inset-top,0px))}
  body{background:var(--bg)}
</style>
</head>
<body>


<header>
  <div class="bar">
    <span class="brand">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="var(--accent)" stroke-width="2.1" stroke-linecap="round"><path d="M3 12h18"/><path d="M5 8v8M5 8h2.6M5 16h2.6"/><path d="M19 8v8M19 8h-2.6M19 16h-2.6"/></g></svg>
      <b>GitFit</b>
    </span>
    <button class="iconbtn" id="themeToggle" title="Toggle theme" aria-label="Toggle light or dark">◐</button>
    <button class="iconbtn" id="gearBtn" data-s="settings" title="Settings" aria-label="Settings">⚙</button>
  </div>
  <nav class="nav" id="nav">
    <button data-s="today" aria-current="true">Today</button>
    <button data-s="weekly">Weekly</button>
    <button data-s="history">History</button>
  </nav>
</header>

<main>
  <section class="screen" id="s-today"></section>
  <section class="screen" id="s-weekly" hidden></section>
  <section class="screen" id="s-workout" hidden></section>
  <section class="screen" id="s-cardio" hidden></section>
  <section class="screen" id="s-mobility" hidden></section>
  <section class="screen" id="s-history" hidden></section>
  <section class="screen" id="s-settings" hidden></section>
</main>

<div id="timerbar" hidden>
  <div class="tinner">
    <div class="tt num" id="tt">0:00</div>
    <div class="presets">
      <button data-sec="90">1:30</button>
      <button data-sec="180">3:00</button>
      <button data-sec="300">5:00</button>
      <button class="tx" id="tpause" aria-label="Pause">⏸</button>
      <button class="tx" id="tstop" aria-label="Stop">✕</button>
    </div>
  </div>
</div>

<div id="player" hidden></div>

<script>
"use strict";
/* ================= program data ================= */
const META = {
  squat:   {name:"Squat",       sets:3, reps:5, color:"var(--s1)", bar:true},
  press:   {name:"Press",       sets:3, reps:5, color:"var(--s2)", bar:true},
  bench:   {name:"Bench Press", sets:3, reps:5, color:"var(--s3)", bar:true},
  deadlift:{name:"Deadlift",    sets:1, reps:5, color:"var(--s4)", bar:true},
  row:     {name:"Barbell Row", sets:3, reps:5, color:"var(--s5)", bar:true},
};
const CHART_LIFTS=["squat","press","bench","deadlift","row"];
const PLAN={1:{A:["squat","press","deadlift"],B:["squat","bench","deadlift"]},
            2:{A:["squat","press","deadlift"],B:["squat","bench","row"]}};
const PLATES={
  lb:[{w:45,c:"#2f6fb0"},{w:35,c:"#d7a000",lite:1},{w:25,c:"#2f8f4e"},{w:10,c:"#e9e9e9",lite:1},{w:5,c:"#c23b2e"},{w:2.5,c:"#9aa0a6",lite:1},{w:1.25,c:"#5b6066",micro:1}],
  kg:[{w:25,c:"#c23b2e"},{w:20,c:"#2f6fb0"},{w:15,c:"#d7a000",lite:1},{w:10,c:"#2f8f4e"},{w:5,c:"#e9e9e9",lite:1},{w:2.5,c:"#c23b2e"},{w:1.25,c:"#9aa0a6",lite:1},{w:0.5,c:"#5b6066",micro:1}],
};
const BARS={lb:[45,35,15],kg:[20,15,10]};

/* coached walk→run ladder. Each level builds an ordered segment list. */
function seg(kind,sec,cue){return {kind,sec,cue};}
function walkOnly(min){return [seg("warmup",300,"Easy warm-up pace"),seg("walk",(min-7)*60,"Brisk — you can talk but not sing"),seg("cooldown",120,"Ease off and slow down")];}
function intervals(runSec,walkSec,rounds){
  const s=[seg("warmup",300,"Easy warm-up walk, loosen up")];
  for(let i=0;i<rounds;i++){ s.push(seg("run",runSec,`Run ${i+1} of ${rounds} — steady and controlled`)); s.push(seg("walk",walkSec,"Recover — relaxed walk, catch your breath")); }
  s.push(seg("cooldown",300,"Cool-down walk, bring the heart rate down"));
  return s;
}
const CARDIO_PLAN=[
  {name:"Walk · 20 min",           tag:"Walk",     build:()=>walkOnly(20)},
  {name:"Walk · 30 min",           tag:"Walk",     build:()=>walkOnly(30)},
  {name:"Walk/Run · 30s run × 6",  tag:"Walk-Run", build:()=>intervals(30,150,6)},
  {name:"Walk/Run · 60s run × 6",  tag:"Walk-Run", build:()=>intervals(60,120,6)},
  {name:"Walk/Run · 90s run × 5",  tag:"Walk-Run", build:()=>intervals(90,150,5)},
  {name:"Walk/Run · 3 min × 4",    tag:"Walk-Run", build:()=>intervals(180,120,4)},
  {name:"Walk/Run · 5 min × 3",    tag:"Walk-Run", build:()=>intervals(300,120,3)},
  {name:"Run · 20 min continuous", tag:"Run",      build:()=>[seg("warmup",300,"Easy warm-up walk"),seg("run",1200,"Easy, sustainable run — keep it conversational"),seg("cooldown",300,"Cool-down walk")]},
];

/* coached mobility routines */
function mv(name,sec,cue,perSide){return {name,sec,cue,perSide:!!perSide};}
const MOBILITY={
  cooldown:{name:"Stretch Cooldown · ~6 min", moves:[
    mv("Seated Neck Rolls",30,"Sit cross-legged, tall spine. Slowly roll your head in a circle — ear toward shoulder, chin to chest — then reverse direction."),
    mv("Bound Angle Pose",40,"Sit with the soles of your feet together, knees falling open. Hold your feet, sit tall, and gently fold forward if it feels good."),
    mv("Easy Pose Arm Stretch",30,"Sit cross-legged. Reach one arm straight across your chest; use the other forearm to gently draw it closer. Switch when prompted.",true),
    mv("Child's Pose",40,"Kneel with big toes together, knees wide. Sit back onto your heels and reach your arms forward, forehead resting down."),
    mv("Cat Cow Pose",40,"On all fours. Inhale and drop the belly, lifting your chest (cow). Exhale and round your spine, tucking the chin (cat). Flow with your breath."),
    mv("Cobra Pose",30,"Lie face down, hands under your shoulders. Press lightly and lift your chest, keeping hips down and shoulders relaxed away from your ears."),
    mv("Downward Dog",40,"From hands and knees, tuck your toes and lift your hips up and back into an upside-down V. Press the floor away; let your heels sink toward the ground."),
    mv("Front Thigh Stretch",30,"Stand tall (hold a wall for balance). Grab one ankle behind you and draw the heel toward your glute, knees together. Switch when prompted.",true),
    mv("Standing Forward Bend",40,"Stand, then hinge at the hips and fold forward with soft knees. Let your head, neck and arms hang heavy toward the floor."),
  ]},
  quick:{name:"Quick · ~3 min", moves:[
    mv("Cat Cow Pose",40,"On all fours, flow between dropping the belly (cow) and rounding the spine (cat) with your breath."),
    mv("Child's Pose",30,"Knees wide, sit back on your heels, reach your arms forward and rest your forehead down."),
    mv("Cobra Pose",30,"Face down, hands under shoulders, gently lift the chest with hips staying on the floor."),
    mv("Downward Dog",30,"Hips up and back into an upside-down V; press the floor away and reach the heels down."),
    mv("Front Thigh Stretch",30,"Standing, draw one heel to your glute, knees together, hold a wall for balance. Switch when prompted.",true),
    mv("Standing Forward Bend",30,"Hinge at the hips and fold forward with soft knees; let everything hang heavy."),
  ]},
};

const DEFAULTS={
  units:"lb", bar:45, micro:false, phase:1,
  lifts:{squat:{weight:95,incr:5,fails:0},press:{weight:45,incr:5,fails:0},bench:{weight:65,incr:5,fails:0},deadlift:{weight:135,incr:10,fails:0},row:{weight:65,incr:5,fails:0}},
  history:[], bodyweight:[], cardio:[], steps:[], mobility:[], habitLog:{},
  sleep:[], water:[], waist:[], recovery:[], dessert:[],
  schedule:["strength","cardio","strength","cardio","strength","cardio","rest"],
  goalWeight:null, stepTarget:8000, cardioTarget:3, cardioLevel:0, sleepTarget:8, waterTarget:8,
};
const KEY="gitfit_v1", OLD_KEY="ironledger_v1";
let S=load(), done={}, timer=null, session=null;

function load(){ try{ let raw=localStorage.getItem(KEY);
  if(!raw){const o=localStorage.getItem(OLD_KEY); if(o){localStorage.setItem(KEY,o);raw=o;}}
  if(raw) return normalize(JSON.parse(raw)); }catch(e){} return structuredClone(DEFAULTS); }
function normalize(p){
  const s=Object.assign(structuredClone(DEFAULTS),p||{});
  s.lifts=Object.assign(structuredClone(DEFAULTS.lifts),p&&p.lifts||{});
  ["history","bodyweight","cardio","steps","mobility","sleep","water","waist","recovery","dessert"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
  if(typeof s.habitLog!=="object"||!s.habitLog||Array.isArray(s.habitLog)) s.habitLog={};
  if(!Array.isArray(s.schedule)||s.schedule.length!==7) s.schedule=DEFAULTS.schedule.slice();
  s.schedule=s.schedule.map(x=>["strength","cardio","rest"].includes(x)?x:"rest");
  if(s.phase!==2)s.phase=1;
  if(typeof s.goalWeight!=="number")s.goalWeight=null;
  s.stepTarget=+s.stepTarget||8000; s.cardioTarget=+s.cardioTarget||3;
  s.sleepTarget=+s.sleepTarget||8; s.waterTarget=+s.waterTarget||8;
  s.cardioLevel=Math.max(0,Math.min(CARDIO_PLAN.length-1,+s.cardioLevel||0));
  return s;
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }

/* ================= pure logic ================= */
const plateSet=()=>PLATES[S.units].filter(p=>!p.micro||S.micro);
const minPlate=()=>plateSet().slice(-1)[0].w;
const step=()=>2*minPlate();
function roundToStep(w){const st=step(),b=S.bar; if(w<=b)return b; return b+Math.round((w-b)/st)*st;}
const fmt=w=>(Math.round(w*100)/100).toString();
const U=()=>S.units;
function platesFor(total){const b=S.bar;let ps=(total-b)/2;const out=[];
  if(ps<=0)return{plates:[],remainder:0,perSide:0};
  for(const p of plateSet()){let n=0;while(ps>=p.w-1e-9){ps=Math.round((ps-p.w)*100)/100;n++;}if(n)out.push({w:p.w,c:p.c,lite:p.lite,count:n});}
  return{plates:out,remainder:Math.round(ps*100)/100,perSide:(total-b)/2};}
function warmups(work){const b=S.bar,out=[seg0(b,5,2)];if(work<=b)return out;let prev=b;
  for(const g of [{p:.4,r:5},{p:.6,r:3},{p:.8,r:2}]){const w=roundToStep(work*g.p);if(w>prev+1e-9&&w<work-1e-9){out.push(seg0(w,g.r,1));prev=w;}}return out;}
function seg0(weight,reps,sets){return {weight,reps,sets,warm:true};}
const todayType=()=>(S.history.length%2===0)?"A":"B";
const plan=()=>PLAN[S.phase][todayType()];
function progress(l,ok){if(ok)return{weight:l.weight+l.incr,fails:0,deloaded:false};const f=(l.fails||0)+1;
  if(f>=3)return{weight:roundToStep(l.weight*0.9),fails:0,deloaded:true};return{weight:l.weight,fails:f,deloaded:false};}

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const sameDay=(a,b)=>{const x=new Date(a),y=new Date(b);return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate();};
function dayKey(ts){const d=new Date(ts);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function weekStart(ts){const d=new Date(ts);const dow=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-dow);return d.getTime();}
const thisWeek=ts=>weekStart(ts)===weekStart(Date.now());
function getCSS(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function cssColor(ref){const m=ref.match(/--[\w-]+/);return m?getCSS(m[0]):ref;}
function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function dur(sec){const m=Math.round(sec/60);return m+" min";}

/* daily status */
const todaySteps=()=>S.steps.find(e=>sameDay(e.date,Date.now()));
const workoutToday=()=>S.history.some(r=>sameDay(r.date,Date.now()));
const cardioToday=()=>S.cardio.filter(c=>sameDay(c.date,Date.now()));
const mobSet=()=>new Set(S.mobility);
const mobDoneToday=()=>mobSet().has(dayKey(Date.now()));
function mobStreak(){const set=mobSet();let d=new Date();d.setHours(0,0,0,0);
  if(!set.has(dayKey(d.getTime())))d.setDate(d.getDate()-1);let n=0;while(set.has(dayKey(d.getTime()))){n++;d.setDate(d.getDate()-1);}return n;}
function habitToday(){return S.habitLog[dayKey(Date.now())]||{};}
function setHabit(k,v){const dk=dayKey(Date.now());S.habitLog[dk]=Object.assign({},S.habitLog[dk],{[k]:v});save();}
const sleepToday=()=>S.sleep.find(e=>sameDay(e.date,Date.now()));
const waterToday=()=>S.water.find(e=>sameDay(e.date,Date.now()));
const recToday=()=>S.recovery.find(e=>sameDay(e.date,Date.now()));
const lastWaist=()=>S.waist[S.waist.length-1];
const waistUnit=()=>S.units==='lb'?'in':'cm';
function setRec(k,v){let e=recToday();if(!e){e={date:Date.now()};S.recovery.push(e);}e[k]=v;save();}
function rateSeg(id,val){let h=`<div class="segsm" data-seg="${id}">`;for(let i=1;i<=5;i++)h+=`<button data-v="${i}" aria-pressed="${val===i}">${i}</button>`;return h+`</div>`;}
const dessertToday=()=>S.dessert.find(e=>sameDay(e.date,Date.now()));
const dessertWeek=()=>S.dessert.filter(e=>thisWeek(e.date)).reduce((a,e)=>a+e.count,0);
const todaySched=()=>S.schedule[(new Date().getDay()+6)%7];
function backBar(){const b=el("button","backlink","‹ Today");b.onclick=()=>go("today");return b;}

function plateStripHTML(total){
  const {plates,remainder}=platesFor(total);
  if(plates.length===0&&remainder===0) return `<div class="plateview"><div class="plate-none">Empty bar — ${fmt(S.bar)} ${U()}</div></div>`;
  let strip=`<span class="barstub"></span>`; const maxW=plateSet()[0].w;
  for(const p of plates){const h=34+24*(p.w/maxW);for(let i=0;i<p.count;i++)strip+=`<span class="plate${p.lite?' lite':''}" style="background:${p.c};height:${h}px">${fmt(p.w)}</span>`;}
  strip+=`<span class="collar"></span>`;
  let legend=plates.map(p=>`<span><span class="perside">${p.count}×</span> ${fmt(p.w)}</span>`).join("");
  if(remainder>0)legend+=`<span class="remainder">+${fmt(remainder)} unloadable</span>`;
  return `<div class="plateview"><div class="plate-wrap">${strip}</div><div class="plate-legend"><span class="perside" style="color:var(--muted)">Per side:</span>${legend}</div></div>`;
}

/* ================= TODAY (hub) ================= */
function renderToday(){
  const wrap=$("#s-today"); wrap.innerHTML=""; const d=new Date();
  const sched=todaySched(), type=todayType();
  const ts0=todaySteps(), stepsOk=(ts0?ts0.count:0)>=S.stepTarget;
  const wt0=waterToday(), waterOk=(wt0?wt0.count:0)>=S.waterTarget;
  const sl0=sleepToday(), rec0=recToday();
  const status={};
  if(sched==="strength") status.workout=workoutToday();
  else if(sched==="cardio") status.cardio=cardioToday().length>0;
  status.mobility=mobDoneToday(); status.steps=stepsOk; status.sleep=!!sl0; status.water=waterOk; status.recovery=!!(rec0&&rec0.energy);
  const doneN=Object.values(status).filter(Boolean).length, totN=Object.keys(status).length, pct=Math.round(doneN/totN*100);

  const dayLabel=sched==="strength"?"Strength day":sched==="cardio"?"Cardio day":"Rest day";
  const head=el("div","h-top");
  head.innerHTML=`<div><div class="eyebrow">${d.toLocaleDateString(undefined,{weekday:"long"})} · ${dayLabel}</div><h1>Today</h1></div>
    <div class="date">${d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}</div>`;
  wrap.appendChild(head);

  const sum=el("div","card");
  sum.innerHTML=`<div class="summary"><div class="ring" style="--p:${pct}"><div class="in num">${doneN}/${totN}</div></div>
    <div class="sx"><b>${doneN===totN?'All done 🎯':'Daily habits'}</b><div>${doneN===totN?'Great work today.':(totN-doneN)+' habit'+((totN-doneN)===1?'':'s')+' left — small wins add up.'}</div></div></div>`;
  wrap.appendChild(sum);

  // scheduled session for the day
  if(sched==="strength"){
    const liftNames=plan().map(k=>META[k].name.replace('Bench Press','Bench').replace('Barbell Row','Row')).join(" · ");
    const c=el("div","card"); c.style.marginTop="12px";
    const b=el("button","hubcard");
    b.innerHTML=`<div class="hi">🏋️</div><div class="hb"><b>Workout ${type}</b><span>${liftNames}</span></div>

/* ================= WEEKLY ================= */
function renderWeekly(){
  const wrap=$("#s-weekly"); wrap.innerHTML="";
  const ws=weekStart(Date.now()), days=[...Array(7)].map((_,i)=>ws+i*86400000);
  const end=ws+6*86400000;
  const head=el("div","h-top");
  head.innerHTML=`<div><div class="eyebrow">${new Date(ws).toLocaleDateString(undefined,{month:"short",day:"numeric"})} – ${new Date(end).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</div><h1>This Week</h1></div>`;
  wrap.appendChild(head);

  const schedStrength=S.schedule.filter(x=>x==="strength").length;
  const wWk=S.history.filter(r=>thisWeek(r.date)).length;
  const cWk=S.cardio.filter(c=>thisWeek(c.date)); const cMin=cWk.reduce((a,c)=>a+c.minutes,0);
  const mobWk=S.mobility.filter(k=>{const t=new Date(k+"T00:00:00").getTime();return t>=ws&&t<=end+86399000;}).length;
  const slWk=S.sleep.filter(e=>thisWeek(e.date)); const slAvg=slWk.length?slWk.reduce((a,e)=>a+e.hours,0)/slWk.length:null;
  const stWk=S.steps.filter(e=>thisWeek(e.date)); const stAvg=stWk.length?Math.round(stWk.reduce((a,e)=>a+e.count,0)/stWk.length):null;
  const waWk=S.water.filter(e=>thisWeek(e.date)); const waAvg=waWk.length?(waWk.reduce((a,e)=>a+e.count,0)/waWk.length):null;
  const deWk=S.dessert.filter(e=>thisWeek(e.date)).reduce((a,e)=>a+e.count,0);
  const bwWk=S.bodyweight.filter(e=>thisWeek(e.date)); const bwChg=bwWk.length>=2?(bwWk[bwWk.length-1].w-bwWk[0].w):null;

  const tile=(k,v,unit,sub)=>`<div class="tile"><div class="k">${k}</div><div class="v num">${v}${unit?`<small> ${unit}</small>`:''}</div>${sub?`<div class="sub2">${sub}</div>`:''}</div>`;
  const tiles=el("div","tiles");
  tiles.innerHTML=
    tile("Strength",wWk,`/ ${schedStrength}`,"sessions done")+
    tile("Cardio",cWk.length,`/ ${S.cardioTarget}`,cMin+" min total")+
    tile("Mobility",mobWk,"/ 7","days")+
    tile("Avg sleep",slAvg!=null?fmt(Math.round(slAvg*10)/10):"—",slAvg!=null?"h":"", "goal "+fmt(S.sleepTarget)+" h")+
    tile("Avg steps",stAvg!=null?stAvg.toLocaleString():"—","","goal "+S.stepTarget.toLocaleString())+
    tile("Water/day",waAvg!=null?fmt(Math.round(waAvg*10)/10):"—","","goal "+S.waterTarget)+
    tile("Desserts",deWk,"","this week")+
    tile("Weight",bwChg!=null?(bwChg>0?"+":"")+fmt(Math.round(bwChg*10)/10):"—",bwChg!=null?U():"","change this week");
  wrap.appendChild(tiles);

  // steps per day this week
  const stepsCard=el("div","card"); stepsCard.style.marginTop="12px";
  stepsCard.innerHTML=`<div class="sect-title" style="padding:12px 15px 2px">Steps by day</div>`;
  const maxSteps=Math.max(S.stepTarget,...days.map(t=>{const e=S.steps.find(x=>sameDay(x.date,t));return e?e.count:0}));
  const dn=["M","T","W","T","F","S","S"];
  let bars=`<div class="weekbars">`;
  days.forEach((t,i)=>{const e=S.steps.find(x=>sameDay(x.date,t)); const c=e?e.count:0; const h=Math.round(c/maxSteps*100);
    bars+=`<div class="b ${c>=S.stepTarget?'hit':''}"><i style="height:${h}%"></i><span>${dn[i]}</span></div>`;});
  bars+=`</div>`;
  stepsCard.insertAdjacentHTML("beforeend",bars);
  wrap.appendChild(stepsCard);

  // mobility week dots
  const mobCard=el("div","card"); mobCard.style.marginTop="12px";
  const set=mobSet(); const dn2=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  let dots=`<div class="sect-title" style="padding:12px 15px 2px">Mobility days</div><div class="dots">`;
  days.forEach((t,i)=>{const dk=dayKey(t);dots+=`<b class="${set.has(dk)?'on':''} ${sameDay(t,Date.now())?'today':''}">${dn2[i]}</b>`;});
  dots+=`</div>`;
  mobCard.innerHTML=dots; wrap.appendChild(mobCard);
}

/* ================= WORKOUT ================= */
function renderWorkout(){
  const type=todayType(), wrap=$("#s-workout"); wrap.innerHTML="";
  wrap.appendChild(backBar());
  const head=el("div","h-top");
  head.innerHTML=`<div><div class="eyebrow">Starting Strength</div><h1>Workout ${type}</h1>
      <span class="phase-pill">Phase ${S.phase} · ${S.phase===1?'Linear progression':'Barbell row'}</span></div>`;
  wrap.appendChild(head);
  plan().forEach(key=>{
    const M=META[key], card=el("div","card"); let idx=0;
    const lift=S.lifts[key], work=lift.weight;
    card.innerHTML=`<div class="ex-head"><div class="n"><span class="dot" style="background:${M.color}"></span><h2>${M.name}</h2></div>
      <div class="scheme">${M.sets}×${M.reps} <b class="num">${fmt(work)}</b><small> ${U()}</small></div></div>`;
    const list=el("div","setlist");
    list.appendChild(el("div","seth","Warm-up"));
    warmups(work).forEach(w=>{const rid=`${key}_${idx++}`;
      const r=el("div","row warm"+(done[rid]?" done":"")); r.dataset.rid=rid;
      r.innerHTML=`<button class="chk" aria-label="done">✓</button>
        <div class="lbl"><span class="set">${w.sets>1?w.sets+" × "+w.reps:w.reps+" reps"}</span>${w.sets>1?'<span class="reps">sets</span>':''}</div>
        <div class="wt num">${fmt(w.weight)}<small>${U()}</small></div><button class="restbtn" data-sec="60">Rest</button>`;
      list.appendChild(r);});
    list.appendChild(el("div","seth",`Work sets · ${M.reps} reps`));
    for(let i=0;i<M.sets;i++){const rid=`${key}_${idx++}`;
      const r=el("div","row"+(done[rid]?" done":"")); r.dataset.rid=rid;
      r.innerHTML=`<button class="chk" aria-label="done">✓</button>
        <div class="lbl"><span class="set">Set ${i+1}</span><span class="reps">${M.reps} reps</span></div>
        <div class="wt num">${fmt(work)}<small>${U()}</small></div><button class="restbtn" data-sec="180">Rest</button>`;
      list.appendChild(r);}
    card.appendChild(list);
    card.insertAdjacentHTML("beforeend",plateStripHTML(work));
    wrap.appendChild(card);
  });
  wrap.appendChild(el("div","spacer"));
  const fin=el("button","btn"); fin.textContent="Finish workout"; fin.onclick=openReview; wrap.appendChild(fin);
}
function openReview(){
  const type=todayType(), wrap=$("#s-workout"); wrap.innerHTML="";
  wrap.innerHTML=`<div class="h-top"><div><div class="eyebrow">Log results</div><h1>Workout ${type}</h1></div></div>`;
  wrap.appendChild(el("p","note","Hit every rep and the weight climbs next time. Miss reps three sessions running and the lift deloads 10%."));
  const card=el("div","card"), picks={};
  plan().forEach(key=>{const M=META[key]; picks[key]=true;
    const lift=S.lifts[key], nx=progress(lift,true), row=el("div","rev-row");
    row.innerHTML=`<span class="dot" style="background:${M.color}"></span>
      <div class="rn"><b>${M.name}</b><span class="num">${M.sets}×${M.reps} @ ${fmt(lift.weight)} ${U()} → next <b class="nx num">${fmt(nx.weight)}</b></span></div>
      <div class="seg" role="group"><button class="hit" aria-pressed="true" data-k="${key}" data-v="1">Done</button><button class="miss" aria-pressed="false" data-k="${key}" data-v="0">Missed</button></div>`;
    card.appendChild(row);
    row.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v==="1";picks[k]=v;
      row.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",(x.dataset.v==="1")===v?"true":"false"));
      const nn=progress(S.lifts[k],v); row.querySelector(".nx").textContent=fmt(nn.weight);});});
  wrap.appendChild(card); wrap.appendChild(el("div","spacer"));
  const sv=el("button","btn"); sv.textContent="Save & advance"; sv.onclick=()=>commit(type,picks);
  const bk=el("button","btn ghost sm"); bk.textContent="Back"; bk.style.marginTop="9px"; bk.onclick=()=>{renderWorkout();window.scrollTo(0,0);};
  wrap.appendChild(sv); wrap.appendChild(bk);
}
function commit(type,picks){
  const rec={date:Date.now(),type,phase:S.phase,units:S.units,lifts:[]};
  plan().forEach(key=>{const M=META[key],ok=picks[key]!==false,lift=S.lifts[key];
    rec.lifts.push({key,name:M.name,weight:lift.weight,success:ok,bar:true});
    const nx=progress(lift,ok); lift.weight=nx.weight; lift.fails=nx.fails; lift._deload=nx.deloaded;});
  S.history.push(rec); done={}; save(); go("today"); window.scrollTo(0,0);
}

/* ================= CARDIO ================= */
function renderCardio(){
  const wrap=$("#s-cardio"); wrap.innerHTML="";
  wrap.innerHTML=`<div class="h-top"><div><div class="eyebrow">Zone 2 · walk to run</div><h1>Cardio</h1></div></div>`;
  wrap.insertBefore(backBar(), wrap.firstChild);
  const weekC=S.cardio.filter(c=>thisWeek(c.date)), weekMin=weekC.reduce((a,c)=>a+c.minutes,0);
  const cc=Math.min(1,weekC.length/S.cardioTarget);
  const prog=el("div","card");
  prog.innerHTML=`<div class="bw-head"><div><div class="eyebrow">This week</div>
      <div class="big num">${weekC.length}<small> / ${S.cardioTarget} sessions · ${weekMin} min</small></div></div></div>
    <div class="prog"><i class="${cc>=1?'hit':''}" style="width:${(cc*100).toFixed(0)}%"></i></div>`;
  wrap.appendChild(prog);

  const lvl=CARDIO_PLAN[S.cardioLevel], segs=lvl.build();
  const total=segs.reduce((a,s)=>a+s.sec,0);
  const colors={warmup:"var(--warm)",walk:"var(--walk)",run:"var(--run)",cooldown:"var(--cool)"};
  const card=el("div","card"); card.style.marginTop="12px";
  let seglist="";
  const grouped=[]; segs.forEach(s=>{const last=grouped[grouped.length-1];
    if(last&&last.kind===s.kind&&last.sec===s.sec)last.n++; else grouped.push({kind:s.kind,sec:s.sec,n:1});});
  grouped.forEach(g=>{ seglist+=`<div class="segline"><span class="tag" style="background:${colors[g.kind]}">${g.kind}</span>
      <span class="sg">${g.n>1?g.n+' × ':''}${mmss(g.sec)}</span></div>`; });
  card.innerHTML=`<div class="lvl-head"><div class="eyebrow">Level ${S.cardioLevel+1} of ${CARDIO_PLAN.length}</div>
      <div class="big">${lvl.name}</div><div class="sub">${dur(total)} total · coached, hands-free</div></div>
    <div class="seglist">${seglist}</div>
    <div class="lvlnav"><button id="lvlDown" ${S.cardioLevel===0?'disabled':''}>← Easier</button><button id="lvlUp" ${S.cardioLevel===CARDIO_PLAN.length-1?'disabled':''}>Harder →</button></div>
    <div style="padding:0 15px 15px"><button class="btn" id="startCardio">Start session</button></div>`;
  wrap.appendChild(card);
  $("#lvlDown").onclick=()=>{S.cardioLevel=Math.max(0,S.cardioLevel-1);save();renderCardio();};
  $("#lvlUp").onclick=()=>{S.cardioLevel=Math.min(CARDIO_PLAN.length-1,S.cardioLevel+1);save();renderCardio();};
  $("#startCardio").onclick=()=>{
    const steps=segs.map(s=>({phase:s.kind,title:s.kind,sec:s.sec,cue:s.cue,color:colors[s.kind]}));
    startSession(lvl.name, steps, ()=>{
      const mins=Math.round(total/60);
      S.cardio.push({date:Date.now(),type:lvl.tag,minutes:mins,level:S.cardioLevel}); save();
    });
  };
  if(S.cardio.length){
    const list=el("div","card"); list.style.marginTop="12px";
    list.innerHTML=`<div class="sect-title" style="padding:12px 15px 2px">Recent sessions</div>`;
    const ic={Walk:"🚶","Walk-Run":"🏃",Run:"🏃"};
    [...S.cardio].reverse().slice(0,8).forEach(c=>{const idx=S.cardio.indexOf(c);
      const r=el("div","logrow");
      r.innerHTML=`<div class="ic">${ic[c.type]||"⚡"}</div><div class="ld"><b>${c.type}</b>
        <div class="dt">${new Date(c.date).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}</div></div>
        <div class="mins num">${c.minutes} min</div><button class="del" data-del="${idx}" aria-label="Delete">✕</button>`;
      list.appendChild(r);});
    wrap.appendChild(list);
    list.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.cardio.splice(+b.dataset.del,1);save();renderCardio();});
  }
}

                     steps.push({phase:"right",title:m.name+" — right",sec:m.sec,cue:"Switch sides. "+m.cue,color:"var(--accent)"}); }
      else steps.push({phase:"hold",title:m.name,sec:m.sec,cue:m.cue,color:"var(--accent)"});

/* ================= coached session player ================= */
function startSession(title, steps, onDone){
  session={title,steps,idx:0,remain:steps[0].sec,paused:false,onDone,
    total:steps.reduce((a,s)=>a+s.sec,0)};
  const p=$("#player"); p.hidden=false;
  p.innerHTML=`<div class="pl-top"><button class="iconbtn" id="plClose" aria-label="Close">✕</button>
      <div class="ttl">${title}</div><div class="cnt" id="plCnt"></div></div>
    <div class="pl-stage"><div class="pl-phase" id="plPhase"></div><div class="pl-time num" id="plTime"></div>
      <div class="pl-cue" id="plCue"></div><div class="pl-next" id="plNext"></div></div>
    <div class="pl-bar"><i id="plBar"></i></div>
    <div class="pl-controls"><button id="plPrev" aria-label="Previous">⏮</button>
      <button class="main" id="plPlay" aria-label="Pause">⏸</button>
      <button id="plSkip" aria-label="Skip">⏭</button></div>`;
  $("#plClose").onclick=endSession;
  $("#plPrev").onclick=()=>jump(-1);
  $("#plSkip").onclick=()=>jump(1);
  $("#plPlay").onclick=()=>{session.paused=!session.paused;$("#plPlay").textContent=session.paused?"▶":"⏸";};
  renderStep();
  clearInterval(session.iv);
  session.iv=setInterval(()=>{ if(!session||session.paused)return;
    session.remain--; updateTime();
    if(session.remain<=0){ cue(session.steps[session.idx]); advance(); }
  },1000);
  if("wakeLock" in navigator){ navigator.wakeLock.request("screen").then(l=>session.wake=l).catch(()=>{}); }
}
function elapsedBefore(i){let t=0;for(let j=0;j<i;j++)t+=session.steps[j].sec;return t;}
function renderStep(){
  const s=session.steps[session.idx];
  $("#plPhase").textContent=s.phase; $("#plPhase").style.background=cssColor(s.color);
  $("#plCue").textContent=s.cue||"";
  const nx=session.steps[session.idx+1];
  $("#plNext").textContent=nx?("Up next · "+nx.title+" · "+mmss(nx.sec)):"Last one — finish strong";
  $("#plCnt").textContent=`${session.idx+1}/${session.steps.length}`;
  updateTime();
}
function updateTime(){
  $("#plTime").textContent=mmss(session.remain);
  const elapsed=elapsedBefore(session.idx)+(session.steps[session.idx].sec-session.remain);
  $("#plBar").style.width=(100*elapsed/session.total).toFixed(1)+"%";
}
function advance(){
  if(session.idx>=session.steps.length-1){ finishSession(); return; }
  session.idx++; session.remain=session.steps[session.idx].sec; renderStep();
}
function jump(dir){
  let n=session.idx+dir; if(n<0)n=0;
  if(n>=session.steps.length){ finishSession(); return; }
  session.idx=n; session.remain=session.steps[session.idx].sec; renderStep();
}
function finishSession(){
  clearInterval(session.iv); doneBeep();
  const cb=session.onDone; try{cb&&cb();}catch(e){}
  const p=$("#player");
  p.innerHTML=`<div class="pl-done"><div class="pl-phase" style="background:var(--good)">Complete</div>
    <div class="big">Nice work 💪</div><div class="pl-cue">${session.title} logged.</div>
    <div style="width:100%;max-width:280px;margin-top:8px"><button class="btn" id="plBack">Back to Today</button></div></div>`;
  $("#plBack").onclick=()=>{ releaseWake(); session=null; $("#player").hidden=true; go("today"); };
}
function endSession(){ if(session){clearInterval(session.iv);} releaseWake(); session=null; $("#player").hidden=true; go("today"); }
function releaseWake(){ try{session&&session.wake&&session.wake.release();}catch(e){} }

function drawWorkChart(lifts,hist){
  hist=hist||S.history;
  const svg=$("#chart"); if(!svg)return;
  const W=340,H=210,mL=34,mR=14,mT=10,mB=26, ink2=getCSS("--chart-ink-2"),grid=getCSS("--chart-grid");
  const series=lifts.map(k=>{const pts=[];hist.forEach((r,i)=>{const h=(r.lifts||[]).find(x=>x.key===k&&x.bar);if(h)pts.push({i,w:h.weight});});return{k,color:cssColor(META[k].color),pts};}).filter(s=>s.pts.length);
  const n=hist.length; let lo=Infinity,hi=-Infinity; series.forEach(s=>s.pts.forEach(p=>{lo=Math.min(lo,p.w);hi=Math.max(hi,p.w);}));
  if(!isFinite(lo)){lo=0;hi=1;} if(lo===hi){lo-=step();hi+=step();}
  const pad=(hi-lo)*0.12||step(); lo=Math.floor(lo-pad); hi=Math.ceil(hi+pad);
  const X=i=>n<=1?mL+(W-mL-mR)/2:mL+(W-mL-mR)*(i/(n-1)); const Y=w=>mT+(H-mT-mB)*(1-(w-lo)/(hi-lo));
  let out="";
  for(let t=0;t<=3;t++){const val=lo+(hi-lo)*t/3,y=Y(val);
    out+=`<line x1="${mL}" y1="${y.toFixed(1)}" x2="${W-mR}" y2="${y.toFixed(1)}" stroke="${grid}" stroke-width="1"/>`;
    out+=`<text x="${mL-6}" y="${(y+3.5).toFixed(1)}" fill="${ink2}" font-size="9" text-anchor="end" font-family="IBM Plex Sans,sans-serif">${Math.round(val)}</text>`;}
  [...new Set([0,n>2?Math.floor((n-1)/2):0,Math.max(0,n-1)])].forEach(i=>{const r=hist[i];if(!r)return;
    out+=`<text x="${X(i).toFixed(1)}" y="${H-9}" fill="${ink2}" font-size="9" text-anchor="middle" font-family="IBM Plex Sans,sans-serif">${new Date(r.date).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</text>`;});
  series.forEach(s=>{const dd=s.pts.map((p,j)=>`${j?'L':'M'}${X(p.i).toFixed(1)} ${Y(p.w).toFixed(1)}`).join(" ");
    out+=`<path d="${dd}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last=s.pts[s.pts.length-1]; out+=`<circle cx="${X(last.i).toFixed(1)}" cy="${Y(last.w).toFixed(1)}" r="3.4" fill="${s.color}" stroke="${getCSS('--chart-surface')}" stroke-width="1.5"/>`;});
  out+=`<line id="cx" x1="0" y1="${mT}" x2="0" y2="${H-mB}" stroke="${ink2}" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>`;
  svg.innerHTML=out;
  const read=$("#chartRead");
  function pick(ev){const rect=svg.getBoundingClientRect();const cxp=((ev.touches?ev.touches[0].clientX:ev.clientX)-rect.left)/rect.width*W;
    let bi=0,bd=1e9;for(let i=0;i<n;i++){const d=Math.abs(X(i)-cxp);if(d<bd){bd=d;bi=i;}}
    svg.querySelector("#cx").setAttribute("x1",X(bi));svg.querySelector("#cx").setAttribute("x2",X(bi));svg.querySelector("#cx").setAttribute("opacity","1");
    const r=hist[bi];
    read.innerHTML=`<b>${new Date(r.date).toLocaleDateString(undefined,{month:"short",day:"numeric"})} · ${r.type}</b> — `+(r.lifts||[]).filter(x=>x.bar).map(x=>`${META[x.key].name.replace('Bench Press','Bench').replace('Barbell Row','Row')} <b>${fmt(x.weight)}</b>`).join(" · ");}
  svg.onpointerdown=pick; svg.onpointermove=e=>{if(e.buttons)pick(e);};
}
function drawLine(sel,pts,color,H,opts){
  opts=opts||{}; const svg=$(sel); if(!svg)return;
  const W=340,mL=34,mR=14,mT=10,mB=22, ink2=getCSS("--chart-ink-2"),grid=getCSS("--chart-grid"),faint=getCSS("--faint"),surf=getCSS("--chart-surface");
  const n=pts.length; let lo=Math.min(...pts.map(p=>p.w)),hi=Math.max(...pts.map(p=>p.w));
  if(typeof opts.goal==="number"){lo=Math.min(lo,opts.goal);hi=Math.max(hi,opts.goal);}
  if(lo===hi){lo-=2;hi+=2;} const pad=(hi-lo)*0.15||1; lo=Math.floor(lo-pad); hi=Math.ceil(hi+pad);
  const X=i=>n<=1?mL+(W-mL-mR)/2:mL+(W-mL-mR)*(i/(n-1)); const Y=w=>mT+(H-mT-mB)*(1-(w-lo)/(hi-lo));
  let out="";
  for(let t=0;t<=2;t++){const val=lo+(hi-lo)*t/2,y=Y(val);
    out+=`<line x1="${mL}" y1="${y.toFixed(1)}" x2="${W-mR}" y2="${y.toFixed(1)}" stroke="${grid}" stroke-width="1"/>`;
    out+=`<text x="${mL-6}" y="${(y+3.5).toFixed(1)}" fill="${ink2}" font-size="9" text-anchor="end" font-family="IBM Plex Sans,sans-serif">${Math.round(val)}</text>`;}
  [0,n-1].forEach(i=>{out+=`<text x="${X(i).toFixed(1)}" y="${H-7}" fill="${ink2}" font-size="9" text-anchor="middle" font-family="IBM Plex Sans,sans-serif">${new Date(pts[i].date).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</text>`;});
  if(typeof opts.goal==="number"){const gy=Y(opts.goal);out+=`<line x1="${mL}" y1="${gy.toFixed(1)}" x2="${W-mR}" y2="${gy.toFixed(1)}" stroke="${getCSS('--good')}" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.9"/>`;}
  const raw=pts.map((p,j)=>`${j?'L':'M'}${X(j).toFixed(1)} ${Y(p.w).toFixed(1)}`).join(" ");
  if(opts.trend){
    out+=`<path d="${raw}" fill="none" stroke="${faint}" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" opacity="0.55"/>`;
    const a=0.35; let ema=pts[0].w; const tp=pts.map((p,j)=>{ema=j?a*p.w+(1-a)*ema:p.w;return {j,w:ema};});
    out+=`<path d="${tp.map((p,j)=>`${j?'L':'M'}${X(p.j).toFixed(1)} ${Y(p.w).toFixed(1)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    const l=tp[tp.length-1]; out+=`<circle cx="${X(l.j).toFixed(1)}" cy="${Y(l.w).toFixed(1)}" r="3.4" fill="${color}" stroke="${surf}" stroke-width="1.5"/>`;
  } else {
    out+=`<path d="${raw}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const l=pts[n-1]; out+=`<circle cx="${X(n-1).toFixed(1)}" cy="${Y(l.w).toFixed(1)}" r="3.4" fill="${color}" stroke="${surf}" stroke-width="1.5"/>`;
  }
  svg.innerHTML=out;
}

  BARS[S.units].forEach(b=>{const btn=el("button",null,`${b} ${U()}`);btn.setAttribute("aria-pressed",S.bar===b);btn.onclick=()=>{S.bar=b;save();renderSettings();};bch.appendChild(btn);});
  bc.appendChild(bch); g2.appendChild(bc);
  g2.insertAdjacentHTML("beforeend",`
    <div class="field"><label>Units<small>Switching changes plates &amp; bar — it won't convert logged numbers</small></label>
      <div class="segsm"><button data-u="lb" aria-pressed="${U()==='lb'}">lb</button><button data-u="kg" aria-pressed="${U()==='kg'}">kg</button></div></div>
    <div class="field"><label>Micro plates<small>${S.units==='lb'?'1.25 lb':'0.5 kg'} available</small></label>
      <button class="switch" id="setMicro" aria-pressed="${S.micro}" aria-label="Micro plates"></button></div>`);
  eq.appendChild(g2); wrap.appendChild(eq);

  const bk=el("div","card"); bk.style.marginTop="12px";
  bk.innerHTML=`<div class="sect-title" style="padding-left:15px">Backup &amp; data</div><div class="set-group">
      <p class="note">Your log lives in this browser only. Copy a backup to move it to another device, then paste it there to restore.</p>
      <div class="row-btns" style="margin:8px 0 10px"><button class="btn ghost sm" id="btnCopy">Copy backup</button><button class="btn ghost sm" id="btnPaste">Restore</button></div>
      <textarea id="backupBox" placeholder="Paste a backup here, then tap Restore" aria-label="Backup data"></textarea><div class="spacer"></div>
      <button class="btn ghost sm danger" id="btnReset">Reset all data</button></div>`;
  wrap.appendChild(bk);

  wrap.querySelectorAll('input[data-k]').forEach(i=>i.onchange=()=>{const v=parseFloat(i.value);if(!isNaN(v)){S.lifts[i.dataset.k][i.dataset.f]=v;save();}});
  wrap.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{S.units=b.dataset.u;S.bar=(S.units==='kg')?20:45;save();renderSettings();});
  $("#setBar").onchange=e=>{const v=parseFloat(e.target.value);if(!isNaN(v)){S.bar=v;save();renderSettings();}};
  $("#setMicro").onclick=()=>{S.micro=!S.micro;save();renderSettings();};
  $("#btnCopy").onclick=async e=>{const data=JSON.stringify(S);
    try{await navigator.clipboard.writeText(data);e.target.textContent="Copied ✓";setTimeout(()=>e.target.textContent="Copy backup",1500);}
    catch(err){const t=$("#backupBox");t.value=data;t.focus();t.select();e.target.textContent="Selected — copy it";}};
  $("#btnPaste").onclick=e=>{const t=$("#backupBox").value.trim();if(!t){e.target.textContent="Paste first";setTimeout(()=>e.target.textContent="Restore",1400);return;}
    try{S=normalize(JSON.parse(t));save();renderSettings();e.target.textContent="Restored ✓";setTimeout(()=>e.target.textContent="Restore",1500);}catch(err){e.target.textContent="Invalid backup";setTimeout(()=>e.target.textContent="Restore",1600);}};
  let armed=false;
  $("#btnReset").onclick=e=>{if(!armed){armed=true;e.target.textContent="Tap again to erase everything";return;}S=structuredClone(DEFAULTS);done={};save();renderSettings();};
}

/* ================= rest timer ================= */
function startTimer(sec){$("#timerbar").hidden=false;document.body.classList.add("has-timer");
  timer={remain:sec,paused:false};tick();clearInterval(timer.iv);
  timer.iv=setInterval(()=>{if(timer.paused)return;timer.remain--;tick();if(timer.remain<=0){clearInterval(timer.iv);doneBeep();}},1000);
  $("#tpause").textContent="⏸";}
function tick(){const s=Math.max(0,timer.remain),t=$("#tt");t.textContent=mmss(s);t.classList.toggle("done",s<=0);}
function tone(f,t0,d,vol){try{const ac=tone.ac||(tone.ac=new (window.AudioContext||window.webkitAudioContext)());
  const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(0.0001,ac.currentTime+t0);g.gain.exponentialRampToValueAtTime(vol||0.25,ac.currentTime+t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+t0+d);o.start(ac.currentTime+t0);o.stop(ac.currentTime+t0+d);}catch(e){}}
function cue(){tone(760,0,.16);tone(1040,.14,.2);if(navigator.vibrate)navigator.vibrate(90);}
function doneBeep(){tone(880,0,.18);tone(1175,.2,.22);tone(1568,.42,.26);if(navigator.vibrate)navigator.vibrate([120,60,120]);}
function stopTimer(){if(timer)clearInterval(timer.iv);timer=null;$("#timerbar").hidden=true;document.body.classList.remove("has-timer");}
$("#tstop").onclick=stopTimer;
$("#tpause").onclick=()=>{if(!timer)return;timer.paused=!timer.paused;$("#tpause").textContent=timer.paused?"▶":"⏸";};
document.querySelectorAll("#timerbar .presets [data-sec]").forEach(b=>b.onclick=()=>startTimer(+b.dataset.sec));

/* ================= global click (workout checkoff + rest) ================= */
document.addEventListener("click",e=>{
  const chk=e.target.closest(".row .chk");
  if(chk){const row=chk.closest(".row");done[row.dataset.rid]=!done[row.dataset.rid];row.classList.toggle("done",done[row.dataset.rid]);return;}
  const rest=e.target.closest(".restbtn");if(rest)startTimer(+rest.dataset.sec);
});

/* ================= nav ================= */
const SCREENS=["today","weekly","workout","cardio","mobility","history","settings"];
function go(name){
  SCREENS.forEach(s=>$("#s-"+s).hidden=(s!==name));
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.s===name?"true":"false"));
  $("#gearBtn").setAttribute("aria-current",name==="settings"?"true":"false");
  ({today:renderToday,weekly:renderWeekly,workout:renderWorkout,cardio:renderCardio,mobility:renderMobility,history:renderHistory,settings:renderSettings}[name])();
  window.scrollTo(0,0);
}
document.querySelectorAll("#nav button, #gearBtn").forEach(b=>b.onclick=()=>go(b.dataset.s));
function refreshAll(){go(SCREENS.find(s=>!$("#s-"+s).hidden)||"today");}

/* ================= theme ================= */
(function(){let pref=null;try{pref=localStorage.getItem("gitfit_theme")||localStorage.getItem("ironledger_theme");}catch(e){}
  if(pref)document.documentElement.setAttribute("data-theme",pref);
  $("#themeToggle").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme");
    const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;const nx=dark?"light":"dark";
    document.documentElement.setAttribute("data-theme",nx);try{localStorage.setItem("gitfit_theme",nx);}catch(e){}refreshAll();};
})();

renderToday();
